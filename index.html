<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sarudi Clicker</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <section class="access-gate" id="access-gate">
      <h1>Sarudi Clicker</h1>
      <form id="access-form">
        <label for="access-key">Access key Demo: QIuQsU90Ltfq7DvvGVEMO53BhPZKlUI6
</label>
        <input id="access-key" name="key" type="password" autocomplete="off" required>
        <button type="submit">Unlock</button>
      </form>
      <p id="access-status" role="status" aria-live="polite"></p>
    </section>
    <section id="game-content" hidden>
      <p class="access-tier" id="access-tier"></p>
      <div class="main">
        <div class="left">
          <h3>Sarudi Bucks: <span class="sarudi-bucks">1000</span></h3>
          <img src="sarudi.png"alt="clickable sarudi buck"class="sarudi-image"onclick="incrementBucks()"draggable="false">
          <h3>Sarudi Bucks per Second: <span class="bucks-per-second">0</span></h3>
        </div>
        <div class="right">
          <div class="upgrade" onclick="buyCursor()">
            <div class="left-section">
              <img src="cursornobackground.png"class="upgrade-image"draggable="flase">
            </div> 
            <div class="mid-section">
              <h4>Cursor</h4>
              <div class="cost-info">
                <p>Cost: <span class="cursor-cost">10</span></p>
                <img src="sarudi.png"class="sarudi-upgrade-image"draggable="false">
              </div>
            </div> 
            <div class="right-section">
              <p>Level <span class="cursor-level">0</span></p>
            </div>
            <div class="next-level-info">
              <p>+ <span class="cursor-increase">1</span>
                Sarudi-Bucks per click</p>
            </div> 
          </div>
          <div class="upgrade" onclick="buyPickaxe()">
            <div class="left-section">
              <img src="pickaxe.webp"class="upgrade-image"draggable="flase">
            </div> 
            <div class="mid-section">
              <h4>Pickaxe</h4>
              <div class="cost-info">
                <p>Cost: <span class="pickaxe-cost">200</span></p>
                <img src="sarudi.png"class="sarudi-upgrade-image"draggable="false">
              </div>
            </div> 
            <div class="right-section">
              <p>Level <span class="pickaxe-level">0</span></p>
            </div>
            <div class="next-level-info">
              <p>+ <span class="pickaxe-increase">3</span>
                Sarudi-Bucks per second</p>
            </div> 
          </div>
        </div>
      </div>
    </section>
    <script src="index.js"></script>
  </body>
</html>
