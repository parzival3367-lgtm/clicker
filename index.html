<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sarudi Clicker</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <section>
      <div class="main">
        <div class="left">
          <h3>Sarudi Bucks: <span class="sarudi-bucks">0</span></h3>
          <img src="Sarudi-no-bg.png"alt="clickable sarudi buck"class="sarudi-image"onclick="incrementSarudiBuck()"draggable="false">
        </div>
        <div class="right">
          <div class="upgrade" onclick="buyCursor()">
            <div class="left-section">
              <img src="cursornobackground.png"class="upgrade-image"draggable="flase">
            </div> 
            <div class="mid-section">
              <h4>Cursor</h4>
              <div class="cost-info">
                <p>Cost: <span class="cursor-cost">10</span></p>
                <img src="Sarudi-no-bg.png"class="sarudi-upgrade-image"draggable="false">
              </div>
            </div> 
            <div class="right-section">
              <p>Level <span class="cursor-level">0</span></p>
            </div>
            <div class="next-level-info">
              <p>+ <span class="Cursor-SBC-increase">1</span>
                Sarudi-Bucks per second</p>
            </div> 
          </div>
        </div>
      </div>
    </section>
    <script src="index.js"></script>
  </body>
</html>
